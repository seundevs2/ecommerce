<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Tech Store</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        header {
            background-color: #343a40;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav a {
            color: white;
            margin: 0 1rem;
            text-decoration: none;
        }
        .hero {
            background: url('https://via.placeholder.com/1500x500') no-repeat center center/cover;
            color: white;
            padding: 5rem 2rem;
            text-align: center;
        }
        .hero h1 {
            font-size: 3rem;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }
        .product-card {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            border-radius: 8px;
        }
        .product-card h3 {
            margin: 1rem 0 0.5rem;
}
            margin: 0.5rem 0;
        }
        .product-card button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .footer {
            background-color: #343a40;
            color: white;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Elite Tech</div>
        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
            <a href="#cart">Cart</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Discover the Best Tech Deals</h1>
        <p>Top gadgets and electronics at unbeatable prices</p>
    </section>

    <section class="products" id="products">
        <div class="product-card">
            <img src="https://via.placeholder.com/300" alt="Product 1">
            <h3>Smartphone Pro X</h3>
            <p>$799.00</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/300" alt="Product 2">
            <h3>Wireless Headphones</h3>
            <p>$199.00</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/300" alt="Product 3">
            <h3>Smartwatch 5</h3>
            <p>$249.00</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/300" alt="Product 4">
            <h3>4K Action Camera</h3>
            <p>$349.00</p>
            <button>Add to Cart</button>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2025 Elite Tech. All rights reserved.</p>
    </footer>
</body>
</html>
